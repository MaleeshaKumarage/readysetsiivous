name: game-ai-live-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    env:
      ENTERTAINMENT_LIVE_SMOKE: "1"
      GAME_GEMINI_API_KEY: ${{ secrets.GEMINI_KEY_2 || secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configured server key
        run: test -n "$GAME_GEMINI_API_KEY"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - run: dotnet restore api/CleaningSuite.Tests/CleaningSuite.Tests.csproj
      - run: dotnet test api/CleaningSuite.Tests/CleaningSuite.Tests.csproj --no-restore --filter FullyQualifiedName~EntertainmentFullRoundLiveTests --verbosity minimal
