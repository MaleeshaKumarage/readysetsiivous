name: agent-pr

on:
  workflow_run:
    workflows: [agent-test]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch (e.g. feature/issue-2)'
        required: true

jobs:
  pr:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, agent]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download branch artifact
        if: github.event_name != 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: agent-test.yml
          name: feature-branch
          path: /tmp
          github_token: ${{ github.token }}

      - name: Resolve branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BR="${{ github.event.inputs.branch }}"
          else
            BR="$(cat /tmp/branch.txt)"
          fi
          echo "BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Deploy feature branch to dev
        run: |
          cd api
          docker build -f docker/Dockerfile -t cleaning-dev-api:dev .
          cd /home/ubuntu/cleaning-dev
          docker compose up -d

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "$BRANCH" \
            --body "Implements $BRANCH.

            ## Dev preview
            UI: http://130.61.208.211/
            API: http://130.61.208.211:8090/"

  skip-reason:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "SKIP agent-pr: upstream agent-test concluded ${{ github.event.workflow_run.conclusion }}"'
