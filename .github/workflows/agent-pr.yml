name: agent-pr

on:
  workflow_run:
    workflows: [agent-test]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch (e.g. feature/issue-2)'
        required: true

jobs:
  pr:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, agent]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Resolve branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BR="${{ github.event.inputs.branch }}"
          else
            BR="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$BRANCH" \
            --body "Implements $BRANCH.

            ## Dev preview
            http://130.61.208.211:8090/"
