name: agent-implement

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Issue number'
        required: true

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.comment.body, 'approve') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: [self-hosted, agent]
    permissions:
      contents: write
      issues: read
    steps:
      - name: Wait for DeepSeek off-peak (50% discount)
        run: |
          echo "DeepSeek peak (UTC Mon-Fri): 01-04, 06-10. Wait if in peak..."
          while true; do
            H=$(date -u +%H); D=$(date -u +%u)
            if [ "$D" -ge 6 ]; then echo "weekend off-peak, go"; break; fi
            case "$H" in
              01|02|03|06|07|08|09) echo "peak ${H}:00 UTC, wait 5m"; sleep 300 ;;
              *) echo "off-peak ${H}:00 UTC, go"; break ;;
            esac
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue + plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            N="${{ github.event.inputs.issue-number }}"
          else
            N="${{ github.event.issue.number }}"
          fi
          echo "N=$N" >> "$GITHUB_ENV"
          gh issue view "$N" --json title -q .title > /tmp/issue-title.txt
          gh issue view "$N" --json body -q .body > /tmp/issue-body.txt
          gh issue view "$N" --json comments -q '.comments[].body' | tail -20 > /tmp/plan.txt

      - name: Configure git
        run: |
          git config user.name "cleaning-agent"
          git config user.email "agent@readysetsiivous.fi"

      - name: Create branch
        run: git checkout -b "feature/issue-$N"

      - name: Set model (DeepSeek)
        run: |
          echo "MODEL=deepseek/deepseek-v4-flash" >> "$GITHUB_ENV"
          echo "using model: deepseek/deepseek-v4-flash"

      - name: Implement (aider)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ~/.local/bin/aider \
            --model "$MODEL" \
            --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
            --message "Implement the feature COMPLETELY and THOROUGHLY, following the approved plan exactly. Modify every file the plan lists, handle edge cases, and add the required tests. Do not leave TODOs or stubs. Issue: $(cat /tmp/issue-title.txt). $(cat /tmp/issue-body.txt). Plan: $(cat /tmp/plan.txt)"

      - name: Push branch
        run: git push -u --force origin "feature/issue-$N"

      - name: Upload branch name
        run: echo "feature/issue-$N" > /tmp/branch.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feature-branch
          path: /tmp/branch.txt
