name: agent-implement

on:
  issue_comment:
    types: [created]

jobs:
  implement:
    if: contains(github.event.comment.body, 'approve') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: [self-hosted, agent]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue + plan
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.event.issue.number }}
          gh issue view "$N" --json title -q .title > /tmp/issue-title.txt
          gh issue view "$N" --json body -q .body > /tmp/issue-body.txt
          # the approved plan is the most recent DeepSeek comment before "approve"
          gh issue view "$N" --json comments -q '.comments[].body' | tail -20 > /tmp/plan.txt
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "cleaning-agent"
          git config user.email "agent@readysetsiivous.fi"

      - name: Create branch
        run: git checkout -b "feature/issue-${{ steps.issue.outputs.number }}"

      - name: Implement (aider + Ollama Qwen)
        run: |
          ~/.local/bin/aider \
            --model ollama_chat/qwen2.5-coder:7b \
            --yes --no-gitignore --no-show-model-warnings \
            --message "Implement this issue following the approved plan below. Issue: $(cat /tmp/issue-title.txt). $(cat /tmp/issue-body.txt). Plan: $(cat /tmp/plan.txt)"

      - name: Build backend
        run: cd api && dotnet build CleaningSuite.Backend.sln -c Release --nologo

      - name: Backend tests + coverage (60% branch)
        run: |
          cd api
          dotnet test CleaningSuite.Backend.sln -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
          # coverage gate enforced by the Playwright/dev step below

      - name: Frontend test (Playwright, new feature + regression)
        run: |
          cd site
          npm ci
          npx playwright install chromium
          npm run dev &
          npx playwright test

      - name: Push branch
        run: git push -u origin "feature/issue-${{ steps.issue.outputs.number }}"

      - name: Create PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "$(cat /tmp/issue-title.txt)" \
            --body "Implements #${{ steps.issue.outputs.number }}." \
            > /tmp/pr-url.txt
          cat /tmp/pr-url.txt

      - name: Review PR (DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ steps.issue.outputs.number }}
          PR=$(gh pr list --head "feature/issue-$N" --json number -q '.[0].number')
          gh pr diff "$PR" > /tmp/diff.txt
          python3 scripts/deepseek.py \
            "You are a senior code reviewer. Review the diff below. List concrete bugs, risks, and suggestions as concise markdown. Be specific." \
            < /tmp/diff.txt > /tmp/review.md
          echo "===== DeepSeek review ====="
          cat /tmp/review.md
          echo "=========================="
          gh pr review "$PR" --comment --body-file /tmp/review.md
