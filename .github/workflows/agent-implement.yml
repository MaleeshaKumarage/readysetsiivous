name: agent-implement

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Issue number'
        required: true
      model:
        description: 'Implementation model'
        required: false
        default: 'local'
        options: ['local', 'remote']

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.comment.body, 'approve') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: [self-hosted, agent]
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue + plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            N="${{ github.event.inputs.issue-number }}"
          else
            N="${{ github.event.issue.number }}"
          fi
          echo "N=$N" >> "$GITHUB_ENV"
          gh issue view "$N" --json title -q .title > /tmp/issue-title.txt
          gh issue view "$N" --json body -q .body > /tmp/issue-body.txt
          gh issue view "$N" --json comments -q '.comments[].body' | tail -20 > /tmp/plan.txt

      - name: Configure git
        run: |
          git config user.name "cleaning-agent"
          git config user.email "agent@readysetsiivous.fi"

      - name: Create branch
        run: git checkout -b "feature/issue-$N"

      - name: Determine model (local/remote)
        run: |
          # comment says "approve remote" -> DeepSeek; else local Ollama/Qwen
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHOICE="${{ github.event.inputs.model }}"
          elif [[ "${{ github.event.comment.body }}" == *"remote"* ]]; then
            CHOICE="remote"
          else
            CHOICE="local"
          fi
          if [ "$CHOICE" = "remote" ]; then
            echo "MODEL=deepseek/deepseek-chat" >> "$GITHUB_ENV"
          else
            echo "MODEL=ollama_chat/qwen2.5-coder:7b" >> "$GITHUB_ENV"
          fi
          echo "using model: $CHOICE"

      - name: Implement (aider)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ~/.local/bin/aider \
            --model "$MODEL" \
            --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
            --message "Implement the feature COMPLETELY and THOROUGHLY, following the approved plan exactly. Modify every file the plan lists, handle edge cases, and add the required tests. Do not leave TODOs or stubs. Issue: $(cat /tmp/issue-title.txt). $(cat /tmp/issue-body.txt). Plan: $(cat /tmp/plan.txt)"

      - name: Push branch
        run: git push -u origin "feature/issue-$N"
