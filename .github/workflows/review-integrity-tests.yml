name: review-integrity-tests
on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  review-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p test_pr_review.py -v
      - run: python3 -m unittest discover -s scripts/tests -p 'test_agent*.py' -v
      - run: bash -n scripts/deepseek_wrap.sh
  linux-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve public test image to immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-slim
          image=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          [[ "$image" =~ ^[a-zA-Z0-9][a-zA-Z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]]
          echo "AGENT_PYTHON_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Test real container and firewall boundaries without provider calls
        env:
          AGENT_LINUX_INTEGRATION: '1'
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo --preserve-env=AGENT_PYTHON_IMAGE,AGENT_LINUX_INTEGRATION python3 -m unittest discover -s scripts/tests -p test_agent_linux.py -v
  artifact-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create synthetic bounded JSON
        run: |
          mkdir -p synthetic
          printf '%s' '{"synthetic":true}' > synthetic/snapshot.json
      - uses: actions/upload-artifact@v4
        id: fixture
        with:
          name: agent-snapshot-${{ github.run_attempt }}
          path: synthetic/snapshot.json
          retention-days: 1
          if-no-files-found: error
      - name: Authenticate actual ZIP bytes and same-run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.fixture.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.fixture.outputs.artifact-digest }}
          WORKFLOW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/agent_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" --kind snapshot --output authenticated/snapshot.json
          cmp synthetic/snapshot.json authenticated/snapshot.json
