name: pr-review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft PRs: review fires when the PR is opened as ready, reopened, or
    # a draft is marked ready_for_review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review diff (DeepSeek Flash V4)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.pull_request.number }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          gh pr diff "$PR" > /tmp/diff.txt
          if [ ! -s /tmp/diff.txt ]; then
            echo "no diff to review"
            exit 0
          fi

          # Reviewers resolve their own threads after verifying the fix.

          # Provider failures must fail the job without claiming a clean review.
          python3 scripts/deepseek.py \
            "You are a senior code reviewer. Do two checks. (1) Find critical / breaking issues: correctness bugs, security vulnerabilities, crashes, data loss, breaking API or DB changes. (2) Find missing Playwright E2E coverage: for every new or changed UI feature (page, button, form, interaction), verify site/e2e/ has a test exercising it — a page with N buttons needs all N tested. Ignore style, formatting, naming, minor suggestions, and nitpicks. Output each issue (critical bug OR missing coverage) as a 3-line block, blank line between blocks: '### FILE: <path>', '### LINE: <n>', '### FIX: <what to change and why>'. LINE is the exact 1-based line number in the NEW file (the '+' side of the hunk). Do not report files under .github/workflows/. If there are no issues, output exactly NO_CRITICAL and nothing else." \
            < /tmp/diff.txt > /tmp/review.txt

          # Keep the response visible even when the reviewer misses the block format.
          cat /tmp/review.txt

          python3 scripts/validate_pr_review.py < /tmp/review.txt

          # Only an exact, standalone clean result reaches this branch.
          if [ "$(cat /tmp/review.txt)" = "NO_CRITICAL" ]; then
            gh pr comment "$PR" --body "AI review completed: no critical issues reported. Existing review conversations still require verification."
            exit 0
          fi

          # 4. Post critical comments + mention @jules.
          python3 scripts/post_review_comments.py "$PR" "$HEAD_SHA" < /tmp/review.txt
          gh pr comment "$PR" --body "@jules please review the comments above and fix the critical issues."
