name: deployment-tests
on:
  pull_request:
    paths:
      - api/deploy/check-keycloak-runtime-env.py
      - api/deploy/docker-compose.yml
      - api/deploy/release-policy.json
      - scripts/release_*.py
      - scripts/tests/test_release_manifest.py
      - .github/workflows/docker-build-push.yml
      - scripts/deploy-api.sh
      - scripts/tests/test_deploy_api.py
      - .github/workflows/docker-deploy-oracle.yml
      - .github/workflows/deployment-tests.yml
  push:
    branches: [main]
    paths:
      - api/deploy/check-keycloak-runtime-env.py
      - api/deploy/docker-compose.yml
      - api/deploy/release-policy.json
      - scripts/release_*.py
      - scripts/tests/test_release_manifest.py
      - .github/workflows/docker-build-push.yml
      - scripts/deploy-api.sh
      - scripts/tests/test_deploy_api.py
      - .github/workflows/docker-deploy-oracle.yml
      - .github/workflows/deployment-tests.yml
permissions:
  contents: read
jobs:
  deployment-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n scripts/deploy-api.sh
      - run: python3 scripts/tests/test_deploy_api.py

      - run: python3 scripts/tests/test_release_manifest.py
