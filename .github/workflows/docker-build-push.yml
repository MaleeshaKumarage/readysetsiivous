name: docker-build-push

on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-api.sh'
      - 'scripts/release_*.py'
      - '.github/workflows/docker-deploy-oracle.yml'
      - 'global.json'
      - 'api/**'
      - '.github/workflows/docker-build-push.yml'
      - '.github/workflows/ci-build-test.yml'

concurrency:
  group: docker-build-push
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/ci-build-test.yml

  build-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maleeshakumarage/readysetsiivous-api
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: api/docker/Dockerfile
          build-args: RELEASE_SHA=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release manifest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/release_manifest.py create --output release.json

      - name: Preserve immutable release manifest
        uses: actions/upload-artifact@v4
        with:
          name: api-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 90