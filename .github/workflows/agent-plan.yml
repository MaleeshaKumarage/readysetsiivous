name: agent-plan

on:
  issue_comment:
    types: [created]

jobs:
  plan:
    if: contains(github.event.comment.body, '@agent') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: [self-hosted, agent]
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.event.issue.number }}
          gh issue view "$N" --json title -q .title > /tmp/issue-title.txt
          gh issue view "$N" --json body -q .body > /tmp/issue-body.txt
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: Generate plan (DeepSeek)
        id: plan
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          {
            echo "## Issue"
            cat /tmp/issue-title.txt
            echo
            cat /tmp/issue-body.txt
            echo
            echo "---"
            echo "## Repository files"
            git ls-files | head -200
            echo "---"
            echo "Brainstorm and write a step-by-step implementation plan."
          } | python3 scripts/deepseek.py \
            "You are a senior software engineer. Brainstorm the issue against the repository files. Write a detailed, ordered implementation plan as markdown. Break the work into sub-tasks; for each: files to change, what to change, how to test. After the plan body, add a section exactly titled '## SUB_ISSUES'. Under it, list each major sub-task as a one-line GitHub issue title, each line prefixed with '- '. Keep titles short and self-contained. If the issue is small and needs no split, write '## SUB_ISSUES' followed by a single '- ' line with the issue title itself. Do not write code, only the plan." \
            > plan.md
          echo "===== DeepSeek plan ====="
          cat plan.md
          echo "=========================="

      - name: Post plan as issue comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" --body-file plan.md

      - name: Create sub-issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ steps.issue.outputs.number }}
          # extract titles under "## SUB_ISSUES" that start with "- "
          sed -n '/## SUB_ISSUES/,/^## /p' plan.md | grep '^- ' | sed 's/^- //' | while IFS= read -r title; do
            [ -z "$title" ] && continue
            url=$(gh issue create --title "$title" --body "Sub-issue of #$N.")
            num=$(echo "$url" | grep -oE '[0-9]+$')
            gh api "repos/MaleeshaKumarage/readysetsiivous/issues/$N/sub_issues" -f "sub_issue_id=$num" >/dev/null
            echo "created + linked: $title (#$num)"
          done
