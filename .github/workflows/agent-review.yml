name: agent-review

on:
  workflow_run:
    workflows: [agent-pr]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number'
        required: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, agent]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Resolve PR + branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ github.event.inputs.pr-number }}"
          else
            PR=$(gh pr list --state open --json number -q '.[0].number')
          fi
          BR=$(gh pr view "$PR" --json headRefName -q .headRefName)
          echo "PR=$PR" >> "$GITHUB_ENV"
          echo "BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Configure git
        run: |
          git config user.name "cleaning-agent"
          git config user.email "agent@readysetsiivous.fi"

      - name: Review PR (DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "$PR" > /tmp/diff.txt
          python3 scripts/deepseek.py \
            "You are a senior code reviewer. Review the diff below. List concrete bugs, risks, and suggestions as concise markdown. Be specific." \
            < /tmp/diff.txt > /tmp/review.md
          echo "===== DeepSeek review ====="
          cat /tmp/review.md
          echo "=========================="
          gh pr review "$PR" --comment --body-file /tmp/review.md

      - name: Fix issues (aider + DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ~/.local/bin/aider \
            --model deepseek/deepseek-chat \
            --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
            --message "Fix every issue raised in this code review. Apply all suggestions, fix all bugs and risks. Review: $(cat /tmp/review.md)"

      - name: Push fixes
        run: git push origin "$BRANCH"
