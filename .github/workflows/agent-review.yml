name: agent-review

on:
  workflow_run:
    workflows: [agent-pr]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number'
        required: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, agent]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Resolve PR + branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ github.event.inputs.pr-number }}"
          else
            PR=$(gh pr list --state open --json number -q '.[0].number')
          fi
          BR=$(gh pr view "$PR" --json headRefName -q .headRefName)
          echo "PR=$PR" >> "$GITHUB_ENV"
          echo "BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Configure git
        run: |
          git config user.name "cleaning-agent"
          git config user.email "agent@readysetsiivous.fi"

      - name: Review-fix loop (max 10)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 10); do
            echo "===== iteration $i ====="
            HEAD_SHA=$(git rev-parse HEAD)
            gh pr diff "$PR" > /tmp/diff.txt
            python3 scripts/deepseek.py \
              "You are a senior code reviewer. Review the diff. Output each issue as a 3-line block: '### FILE: <file path>', '### LINE: <line number>', '### FIX: <one sentence exactly what code to change on that line>'. Separate blocks with a blank line. Do not report files under .github/workflows/ or ci-build-test.yml. If there are no issues, output exactly NO_ISSUES and nothing else." \
              < /tmp/diff.txt > /tmp/review.txt
            cat /tmp/review.txt

            python3 scripts/post_review_comments.py "$PR" "$HEAD_SHA" < /tmp/review.txt

            if grep -q "NO_ISSUES" /tmp/review.txt; then
              echo "no issues — done"
              break
            fi

            if [ ! -s /tmp/fixes.list ]; then
              echo "no fixes to apply — done"
              break
            fi

            echo "--- fixing one by one ---"
            while IFS=$'\t' read -r file line fix; do
              echo ">> fixing $file:$line"
              ~/.local/bin/aider \
                --model deepseek/deepseek-v4-flash \
                --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
                --message "Fix only this one issue. File: $file, near line $line. $fix"
            done < /tmp/fixes.list

            git push origin "$BRANCH"
          done

      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "$PR"
