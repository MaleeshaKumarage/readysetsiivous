name: agent-review

on:
  workflow_run:
    workflows: [agent-pr]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number'
        required: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, agent]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Resolve PR + branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ github.event.inputs.pr-number }}"
          else
            PR=$(gh pr list --state open --json number -q '.[0].number')
          fi
          BR=$(gh pr view "$PR" --json headRefName -q .headRefName)
          echo "PR=$PR" >> "$GITHUB_ENV"
          echo "BRANCH=$BR" >> "$GITHUB_ENV"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Configure git
        run: |
          git config user.name "cleaning-agent"
          git config user.email "agent@readysetsiivous.fi"

      - name: Review-fix loop (max 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            echo "===== iteration $i ====="
            gh pr diff "$PR" > /tmp/diff.txt
            sleep 15
            python3 scripts/gemini.py \
              "You are a senior code reviewer. Review the diff below. If there are NO issues at all, respond with exactly NO_ISSUES and nothing else. Otherwise list concrete bugs, risks, and suggestions as concise markdown." \
              < /tmp/diff.txt > /tmp/review.md
            cat /tmp/review.md
            gh pr review "$PR" --comment --body-file /tmp/review.md

            if grep -q "NO_ISSUES" /tmp/review.md; then
              echo "no issues — done"
              break
            fi

            echo "--- fixing ---"
            ~/.local/bin/aider \
              --model gemini/gemini-flash-latest \
              --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
              --message "Fix every issue raised in this review. Do not leave any TODO or stub. Review: $(cat /tmp/review.md)"
            git push origin "$BRANCH"
          done

      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "$PR"
