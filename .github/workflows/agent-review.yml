name: agent-review

on:
  workflow_run:
    workflows: [agent-pr]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number'
        required: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, agent]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Resolve PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ github.event.inputs.pr-number }}"
          else
            BR="${{ github.event.workflow_run.head_branch }}"
            PR=$(gh pr list --head "$BR" --json number -q '.[0].number')
          fi
          echo "PR=$PR" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Review PR (DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "$PR" > /tmp/diff.txt
          python3 scripts/deepseek.py \
            "You are a senior code reviewer. Review the diff below. List concrete bugs, risks, and suggestions as concise markdown. Be specific." \
            < /tmp/diff.txt > /tmp/review.md
          echo "===== DeepSeek review ====="
          cat /tmp/review.md
          echo "=========================="
          gh pr review "$PR" --comment --body-file /tmp/review.md
