name: ci-build-test

on:
  workflow_call:
  pull_request:
    paths:
      - 'global.json'
      - 'scripts/wait-api-release.py'
      - 'scripts/tests/test_wait_api_release.py'
      - 'api/**'
      - 'site/**'
      - '.github/workflows/ci-build-test.yml'
  push:
    branches: [main]
    paths:
      - 'global.json'
      - 'scripts/wait-api-release.py'
      - 'scripts/tests/test_wait_api_release.py'
      - 'api/**'
      - 'site/**'
      - '.github/workflows/ci-build-test.yml'

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: security_tests
          POSTGRES_USER: security_tests
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security_tests -d security_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Verify frontend/API release ordering
        working-directory: .
        run: python3 -m unittest scripts/tests/test_wait_api_release.py
      - name: Ensure audio validation runtime
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: dotnet restore CleaningSuite.Backend.sln
      - run: dotnet build CleaningSuite.Backend.sln --no-restore -c Release
      - run: dotnet test CleaningSuite.Backend.sln --no-build -c Release --verbosity minimal
        env:
          QC_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=security_tests;Username=security_tests;Password=synthetic_ci_only
          INVITE_TEST_DATABASE: Host=localhost;Port=5432;Database=security_tests;Username=security_tests;Password=synthetic_ci_only

  frontend-e2e-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
