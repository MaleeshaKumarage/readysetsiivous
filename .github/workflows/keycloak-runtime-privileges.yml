name: Scoped Keycloak runtime rehearsal
on:
  pull_request:
    paths:
      - 'api/CleaningSuite.Infrastructure/Keycloak/**'
      - 'api/deploy/*keycloak*'
      - 'api/deploy/keycloak_fgap.py'
      - 'api/deploy/keycloak_identity_extension.py'
      - 'api/keycloak-identity-extension/**'
      - 'api/CleaningSuite.Tests/**'
      - '.github/workflows/keycloak-runtime-privileges.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: identity_tests
          POSTGRES_USER: identity_tests
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U identity_tests -d identity_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify setup check and secret output safety
        run: |
          python3 -B api/deploy/test_keycloak_employee_setup.py
          python3 -B api/deploy/test_keycloak_runtime_env.py
          python3 -B api/deploy/test_keycloak_fgap.py
          python3 -B api/deploy/test_keycloak_identity_extension.py
          python3 -B api/deploy/test_keycloak_operator_setup.py
          python3 -B api/deploy/test_keycloak_production_identity_setup.py
      - name: Build reviewed development identity extension
        run: docker build -t cleaning-identity-rehearsal:ci api/keycloak-identity-extension
      - name: Start isolated synthetic identity service
        env:
          SYNTHETIC_PASSWORD: audience_test_only_2026
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker network create scoped-identity
          docker network connect --alias identity-postgres scoped-identity "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" psql -U identity_tests -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE keycloak_identity'
          docker run -d --name invite-review-mail --network scoped-identity -p 127.0.0.1:12525:8025 axllent/mailpit:v1.27.8
          docker run -d --name scoped-keycloak --network scoped-identity -p 127.0.0.1:18480:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=audience-test-admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$SYNTHETIC_PASSWORD" \
            -e KC_DB=postgres -e KC_DB_URL=jdbc:postgresql://identity-postgres:5432/keycloak_identity \
            -e KC_DB_USERNAME=identity_tests -e KC_DB_PASSWORD=synthetic_ci_only \
            cleaning-identity-rehearsal:ci start-dev
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18480/realms/master/.well-known/openid-configuration >/dev/null; then
              test "$(docker exec "$POSTGRES_CONTAINER" psql -U identity_tests -d keycloak_identity -Atc "select count(*) from realm where name='master'")" = 1
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Prove extension grants, denials and privileged-account drift protection
        env:
          SYNTHETIC_KEYCLOAK_URL: http://127.0.0.1:18480
          SYNTHETIC_KEYCLOAK_ADMIN_PASSWORD: audience_test_only_2026
          SYNTHETIC_KEYCLOAK_ADMIN_USER: audience-test-admin
        run: python3 api/deploy/test-keycloak-runtime-privileges.py
      - name: Native guarded invitation and stale password form regressions
        env:
          SYNTHETIC_KEYCLOAK_URL: http://127.0.0.1:18480
          SYNTHETIC_MAILBOX_URL: http://127.0.0.1:12525
          SYNTHETIC_KEYCLOAK_ADMIN_PASSWORD: audience_test_only_2026
          SYNTHETIC_KEYCLOAK_ADMIN_USER: audience-test-admin
        run: python3 -B api/keycloak-identity-extension/tests/guarded_invitations.py
      - name: Native production enrollment and credential-preservation rehearsal
        env:
          SYNTHETIC_KEYCLOAK_URL: http://127.0.0.1:18480
          SYNTHETIC_KEYCLOAK_ADMIN_PASSWORD: audience_test_only_2026
          SYNTHETIC_KEYCLOAK_ADMIN_USER: audience-test-admin
          SYNTHETIC_STOPPED_API_CONTAINER: identity-production-ci-api
          SYNTHETIC_FIXTURE_PURPOSE: identity-production-ci
        run: |
          docker create --name identity-production-ci-api \
            --label purpose=identity-production-ci \
            --label com.docker.compose.service=api \
            --label com.docker.compose.project=identity-production-ci postgres:16-alpine
          python3 -B api/keycloak-identity-extension/tests/production_identity_setup.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Native scoped invitations and API audience regression
        env:
          INVITE_TEST_DATABASE: Host=localhost;Port=5432;Database=identity_tests;Username=identity_tests;Password=synthetic_ci_only
          INVITE_TEST_KEYCLOAK_URL: http://127.0.0.1:18480
          INVITE_TEST_ADMIN_USER: audience-test-admin
          INVITE_TEST_ADMIN_PASSWORD: audience_test_only_2026
          INVITE_TEST_MAILBOX_URL: http://127.0.0.1:12525
          AUDIENCE_TEST_DATABASE: Host=localhost;Port=5432;Database=identity_tests;Username=identity_tests;Password=synthetic_ci_only
          AUDIENCE_TEST_KEYCLOAK_URL: http://127.0.0.1:18480
        run: >-
          dotnet test api/CleaningSuite.Tests/CleaningSuite.Tests.csproj -m:1 -p:BuildInParallel=false
          --filter 'FullyQualifiedName~NativeSetupEmailBindsIdentityRetriesDeliveryAndSerializesParallelInvites|FullyQualifiedName~ProvisionedRealmIssuesApiAudienceOnLoginAndRefreshButNotIdToken'
      - name: Build separate synthetic credential-rollback test image
        run: >-
          docker build --build-arg IDENTITY_BASE=cleaning-identity-rehearsal:ci
          -f api/keycloak-identity-extension/tests/fault-provider/Dockerfile
          -t cleaning-identity-rehearsal-fault:ci api/keycloak-identity-extension
      - name: Prove consumed invitation stays revoked after native credential rollback
        env:
          SYNTHETIC_KEYCLOAK_URL: http://127.0.0.1:18480
          SYNTHETIC_MAILBOX_URL: http://127.0.0.1:12525
          SYNTHETIC_KEYCLOAK_ADMIN_PASSWORD: audience_test_only_2026
          SYNTHETIC_KEYCLOAK_ADMIN_USER: audience-test-admin
        run: |
          docker rm -f scoped-keycloak
          docker run -d --name scoped-keycloak --network scoped-identity -p 127.0.0.1:18480:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$SYNTHETIC_KEYCLOAK_ADMIN_USER" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$SYNTHETIC_KEYCLOAK_ADMIN_PASSWORD" \
            -e KC_DB=postgres -e KC_DB_URL=jdbc:postgresql://identity-postgres:5432/keycloak_identity \
            -e KC_DB_USERNAME=identity_tests -e KC_DB_PASSWORD=synthetic_ci_only \
            cleaning-identity-rehearsal-fault:ci start-dev
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$SYNTHETIC_KEYCLOAK_URL/realms/master/.well-known/openid-configuration" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          python3 -B api/keycloak-identity-extension/tests/credential_rollback.py
      - name: Remove disposable identity service
        if: always()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for name in scoped-keycloak invite-review-mail identity-production-ci-api; do
            if docker container inspect "$name" >/dev/null 2>&1; then docker rm -fv "$name"; fi
          done
          if docker network inspect scoped-identity >/dev/null 2>&1; then
            if test "$(docker inspect --format '{{if index .NetworkSettings.Networks "scoped-identity"}}connected{{end}}' "$POSTGRES_CONTAINER")" = connected; then
              docker network disconnect scoped-identity "$POSTGRES_CONTAINER"
            fi
            docker network rm scoped-identity
          fi
