name: agent-test

on:
  workflow_run:
    workflows: [agent-implement]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (e.g. feature/issue-2)'
        required: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, agent]
    permissions:
      contents: write
    steps:
      - name: Download branch artifact
        if: github.event_name != 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: agent-implement.yml
          name: feature-branch
          path: /tmp
          github_token: ${{ github.token }}

      - name: Resolve branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> "$GITHUB_ENV"
          else
            echo "BRANCH=$(cat /tmp/branch.txt)" >> "$GITHUB_ENV"
          fi

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Configure git
        run: |
          git config user.name "cleaning-agent"
          git config user.email "agent@readysetsiivous.fi"

      - name: Upload branch (for pr)
        run: echo "$BRANCH" > /tmp/branch.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feature-branch
          path: /tmp/branch.txt

      - name: Test-fix loop (max 3)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          for i in 1 2 3; do
            echo "===== test iteration $i ====="

            # --- backend build ---
            (cd api && dotnet build CleaningSuite.Backend.sln -c Release --nologo > /tmp/build.log 2>&1)
            if [ $? -ne 0 ]; then
              ~/.local/bin/aider --model deepseek/deepseek-chat --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
                --message "Fix these build errors: $(tail -40 /tmp/build.log)"
              git push origin "$BRANCH"
              continue
            fi

            # --- backend tests + coverage ---
            (cd api && dotnet test CleaningSuite.Backend.sln -c Release --no-build \
              --collect:"XPlat Code Coverage" --results-directory ./TestResults > /tmp/test.log 2>&1)
            if [ $? -ne 0 ]; then
              ~/.local/bin/aider --model deepseek/deepseek-chat --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
                --message "Fix these failing tests: $(tail -40 /tmp/test.log)"
              git push origin "$BRANCH"
              continue
            fi

            # --- coverage gate ---
            (cd api && python3 -c 'import xml.etree.ElementTree as ET,glob,sys; f=glob.glob("TestResults/**/coverage.cobertura.xml",recursive=True)[0]; b=float(ET.parse(f).getroot().get("branch-rate",0)); print("branch coverage %.1f%%" % (b*100)); sys.exit(1 if b<0.10 else 0)')
            if [ $? -ne 0 ]; then
              ~/.local/bin/aider --model deepseek/deepseek-chat --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
                --message "Add tests to raise branch coverage to at least 10%."
              git push origin "$BRANCH"
              continue
            fi

            # --- frontend Playwright ---
            (cd site && npm ci > /tmp/npm.log 2>&1 && npx playwright install chromium >/dev/null 2>&1 && \
              (npm run storybook > /tmp/sb.log 2>&1 &) && \
              for j in $(seq 1 60); do curl -sf http://localhost:6006 >/dev/null && break; sleep 2; done && \
              npx playwright test > /tmp/pw.log 2>&1)
            if [ $? -ne 0 ]; then
              echo "--- playwright failures ---"
              tail -40 /tmp/pw.log 2>/dev/null
              ~/.local/bin/aider --model deepseek/deepseek-chat --yes --no-gitignore --no-show-model-warnings --no-detect-urls \
                --message "Fix these failing Playwright tests: $(tail -40 /tmp/pw.log)"
              git push origin "$BRANCH"
              continue
            fi

            echo "===== all tests pass ====="
            break
          done
