name: agent-test

on:
  push:
    branches: [feature/*]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (e.g. feature/issue-2)'
        required: true

jobs:
  test:
    runs-on: [self-hosted, agent]
    steps:
      - name: Resolve branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> "$GITHUB_ENV"
          else
            echo "BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Build backend
        run: cd api && dotnet build CleaningSuite.Backend.sln -c Release --nologo

      - name: Backend tests + coverage (60% branch)
        run: |
          cd api
          dotnet test CleaningSuite.Backend.sln -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, glob, sys
          f = glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True)[0]
          root = ET.parse(f).getroot()
          line = float(root.get('line-rate', 0)); branch = float(root.get('branch-rate', 0))
          print(f'coverage: line {line:.1%}, branch {branch:.1%}')
          if branch < 0.6:
              print(f'FAIL: branch coverage {branch:.1%} below 60%')
              sys.exit(1)
          PY

      - name: Frontend test (Playwright regression)
        run: |
          cd site
          npm ci
          npx playwright install chromium
          npm run dev &
          npx playwright test
