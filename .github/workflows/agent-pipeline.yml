name: agent-pipeline

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Approved issue number
        required: true
        type: string
      plan-comment-id:
        description: Exact trusted plan comment ID
        required: true
        type: string
      plan-sha256:
        description: SHA256 of exact UTF8 comment body
        required: true
        type: string
      base-sha:
        description: Approved full base commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: agent-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  control:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      snapshot-sha256: ${{ steps.snapshot.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture exact authorized plan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue-number }}
          COMMENT: ${{ inputs.plan-comment-id }}
          PLAN_HASH: ${{ inputs.plan-sha256 }}
          BASE_SHA: ${{ inputs.base-sha }}
          SNAPSHOT_OUTPUT: snapshot/snapshot.json
        run: |
          mkdir -p snapshot
          python3 scripts/agent_contract.py prepare --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" --comment "$COMMENT" --plan-sha256 "$PLAN_HASH" --base-sha "$BASE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_TRIGGERING_ACTOR" --output "$SNAPSHOT_OUTPUT"
      - name: Bind canonical snapshot
        id: snapshot
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          snapshot = json.loads(Path('snapshot/snapshot.json').read_text(encoding='utf-8'))
          digest = hashlib.sha256(json.dumps(snapshot, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha256={digest}\n')
          PY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: agent-snapshot-${{ github.run_attempt }}
          path: snapshot/snapshot.json
          if-no-files-found: error
          retention-days: 3
  generation:
    needs: [control]
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and authenticate snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.control.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.control.outputs.artifact-digest }}
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" --kind snapshot --output snapshot/snapshot.json
          python3 scripts/agent_contract.py check-artifact --snapshot snapshot/snapshot.json \
          --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" \
          --kind snapshot --expected-snapshot-sha256 "$SNAPSHOT_HASH"
      - name: Fetch approved base objects as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from pathlib import Path
          base = json.loads(Path('snapshot/snapshot.json').read_text(encoding='utf-8'))['base_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', base):
              raise SystemExit('invalid base SHA')
          environment = dict(os.environ)
          credential = base64.b64encode(('x-access-token:' + environment.pop('GH_TOKEN')).encode()).decode()
          environment.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + credential)
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', base], env=environment, check=True)
          PY
      - name: Revalidate approval immediately before generation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue-number }}
          COMMENT: ${{ inputs.plan-comment-id }}
          PLAN_HASH: ${{ inputs.plan-sha256 }}
          BASE_SHA: ${{ inputs.base-sha }}
          SNAPSHOT_OUTPUT: revalidated.json
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
        run: |
          python3 scripts/agent_contract.py prepare --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" --comment "$COMMENT" --plan-sha256 "$PLAN_HASH" --base-sha "$BASE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --actor "$GITHUB_TRIGGERING_ACTOR" --output "$SNAPSHOT_OUTPUT"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          body = json.loads(Path('revalidated.json').read_text(encoding='utf-8'))
          actual = hashlib.sha256(json.dumps(body, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          if actual != os.environ['SNAPSHOT_HASH']:
              raise SystemExit('approval changed; new explicit approval required')
          PY
      - name: Pull approved immutable python image
        env:
          APPROVED_IMAGE: ${{ vars.AGENT_PYTHON_IMAGE }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          image = os.environ['APPROVED_IMAGE']
          if not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9./:_-]*@sha256:[0-9a-f]{64}', image):
              raise SystemExit('approved immutable image required')
          subprocess.run(['docker', 'pull', image], check=True)
          PY
      - name: Generate bounded proposal through isolated gateway
        env:
          AGENT_PYTHON_IMAGE: ${{ vars.AGENT_PYTHON_IMAGE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p proposal
          sudo --preserve-env=AGENT_PYTHON_IMAGE,DEEPSEEK_API_KEY python3 scripts/agent_sandbox.py generate --snapshot snapshot/snapshot.json --output proposal/proposal.json
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: agent-proposal-${{ github.run_attempt }}
          path: proposal/proposal.json
          if-no-files-found: error
          retention-days: 3
  verification:
    needs: [control, generation]
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and authenticate snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.control.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.control.outputs.artifact-digest }}
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" --kind snapshot --output snapshot/snapshot.json
          python3 scripts/agent_contract.py check-artifact --snapshot snapshot/snapshot.json \
          --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" \
          --kind snapshot --expected-snapshot-sha256 "$SNAPSHOT_HASH"
      - name: Download and authenticate proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.generation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.generation.outputs.artifact-digest }}
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" --kind proposal --output proposal/proposal.json
          python3 scripts/agent_contract.py check-artifact --snapshot snapshot/snapshot.json \
          --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" \
          --kind proposal --expected-snapshot-sha256 "$SNAPSHOT_HASH"
      - name: Fetch approved base objects as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from pathlib import Path
          base = json.loads(Path('snapshot/snapshot.json').read_text(encoding='utf-8'))['base_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', base):
              raise SystemExit('invalid base SHA')
          environment = dict(os.environ)
          credential = base64.b64encode(('x-access-token:' + environment.pop('GH_TOKEN')).encode()).decode()
          environment.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + credential)
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', base], env=environment, check=True)
          PY
      - name: Pull approved immutable toolchain image
        env:
          APPROVED_IMAGE: ${{ vars.AGENT_TOOLCHAIN_IMAGE }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          image = os.environ['APPROVED_IMAGE']
          if not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9./:_-]*@sha256:[0-9a-f]{64}', image):
              raise SystemExit('approved immutable image required')
          subprocess.run(['docker', 'pull', image], check=True)
          PY
      - name: Verify proposal in offline restricted container
        env:
          AGENT_TOOLCHAIN_IMAGE: ${{ vars.AGENT_TOOLCHAIN_IMAGE }}
          AGENT_SOURCE_BASE_SHA: ${{ inputs.base-sha }}
        run: |
          mkdir -p verification
          python3 scripts/agent_sandbox.py verify --snapshot snapshot/snapshot.json --proposal proposal/proposal.json --output verification/verification.json
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: agent-verification-${{ github.run_attempt }}
          path: verification/verification.json
          if-no-files-found: error
          retention-days: 3
  publication:
    needs: [control, generation, verification]
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and authenticate snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.control.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.control.outputs.artifact-digest }}
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" --kind snapshot --output snapshot/snapshot.json
          python3 scripts/agent_contract.py check-artifact --snapshot snapshot/snapshot.json \
          --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" \
          --kind snapshot --expected-snapshot-sha256 "$SNAPSHOT_HASH"
      - name: Download and authenticate proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.generation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.generation.outputs.artifact-digest }}
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" --kind proposal --output proposal/proposal.json
          python3 scripts/agent_contract.py check-artifact --snapshot snapshot/snapshot.json \
          --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" \
          --kind proposal --expected-snapshot-sha256 "$SNAPSHOT_HASH"
      - name: Download and authenticate verification artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verification.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.verification.outputs.artifact-digest }}
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/agent_artifact.py --repo "$GITHUB_REPOSITORY" --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" --kind verification --output verification/verification.json
          python3 scripts/agent_contract.py check-artifact --snapshot snapshot/snapshot.json \
          --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --workflow-sha "$WORKFLOW_SHA" \
          --kind verification --expected-snapshot-sha256 "$SNAPSHOT_HASH"
      - name: Validate receipt and publish only a dedicated draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_HASH: ${{ needs.control.outputs.snapshot-sha256 }}
        run: >-
          python3 scripts/agent_contract.py publish --snapshot snapshot/snapshot.json
          --proposal proposal/proposal.json --verification verification/verification.json
          --expected-snapshot-sha256 "$SNAPSHOT_HASH" --output publication.json
