name: docker-deploy-oracle

on:
  workflow_run:
    workflows: ["docker-build-push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA of an already built API release
        required: true
        type: string

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GAME_GEMINI_API_KEY: ${{ secrets.GEMINI_KEY_2 || secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate release SHA
        run: '[[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - name: Sync production Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: 130.61.140.7
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: api/deploy/docker-compose.yml
          target: /home/ubuntu/cleaning-suite
          strip_components: 2
          overwrite: true
      - name: Deploy to Oracle via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 130.61.140.7
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: RELEASE_SHA,REGISTRY_USER,REGISTRY_TOKEN,GAME_GEMINI_API_KEY
          script_path: scripts/deploy-api.sh
          command_timeout: 10m
