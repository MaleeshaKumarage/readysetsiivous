name: docker-deploy-oracle

on:
  workflow_run:
    workflows: ["docker-build-push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA of an already built API release
        required: true
        type: string

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GAME_GEMINI_API_KEY: ${{ secrets.GAME_GEMINI_API_KEY || secrets.GEMINI_KEY_1 || secrets.GEMINI_KEY_2 || secrets.GEMINI_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 || secrets.GEMINI_KEY }}
      GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 || secrets.GEMINI_API_KEY }}
      GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
      GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
      GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
      GEMINI_KEY_6: ${{ secrets.GEMINI_KEY_6 }}
      GEMINI_KEY_7: ${{ secrets.GEMINI_KEY_7 }}
      GEMINI_KEY_8: ${{ secrets.GEMINI_KEY_8 }}
      GEMINI_KEY_9: ${{ secrets.GEMINI_KEY_9 }}
      GEMINI_KEY_10: ${{ secrets.GEMINI_KEY_10 }}
      GAME_GEMINI_RPM: ${{ vars.GAME_GEMINI_RPM || '3' }}
      GAME_GEMINI_RPD: ${{ vars.GAME_GEMINI_RPD || '15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate release SHA
        run: '[[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - name: Sync production Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: 130.61.140.7
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: api/deploy/docker-compose.yml
          target: /home/ubuntu/cleaning-suite
          strip_components: 2
          overwrite: true
      - name: Deploy to Oracle via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 130.61.140.7
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: RELEASE_SHA,REGISTRY_USER,REGISTRY_TOKEN,GAME_GEMINI_API_KEY,GEMINI_KEY_1,GEMINI_KEY_2,GEMINI_KEY_3,GEMINI_KEY_4,GEMINI_KEY_5,GEMINI_KEY_6,GEMINI_KEY_7,GEMINI_KEY_8,GEMINI_KEY_9,GEMINI_KEY_10,GAME_GEMINI_RPM,GAME_GEMINI_RPD
          script_path: scripts/deploy-api.sh
          command_timeout: 10m
