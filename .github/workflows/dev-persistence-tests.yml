name: dev-persistence-tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - api/dev/docker-compose.yml
      - api/deploy/docker-compose.dev.yml
      - api/dev/init/**
      - api/dev/tests/**
      - .github/workflows/dev-persistence-tests.yml
  push:
    branches: [main]
    paths:
      - api/dev/docker-compose.yml
      - api/deploy/docker-compose.dev.yml
      - api/dev/init/**
      - api/dev/tests/**
      - .github/workflows/dev-persistence-tests.yml
permissions:
  contents: read
jobs:
  recreate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag inventory
        with:
          persist-credentials: false
      - name: Validate initialization syntax
        run: |
          bash -n api/dev/init/01-keycloak.sh
          # Official PostgreSQL entrypoints source non-executable .sh scripts.
          # Do not let strict mode escape into the calling entrypoint.
          bash -c 'psql() { cat >/dev/null; }; export DEV_KC_DB_PASSWORD=fixture POSTGRES_USER=fixture POSTGRES_DB=fixture; before=$(set +o); source api/dev/init/01-keycloak.sh; after=$(set +o); test "$before" = "$after" || exit 1; test -z "${UNSET_PARENT_VARIABLE}"'
      - name: Validate loopback binds and dev public origins without starting services
        run: python3 api/dev/tests/test_dev_ingress.py
      - name: Validate state-only rehearsal fixture
        run: python3 api/dev/tests/test_dev_persistence_fixture.py
      - name: Recreate disposable dev stacks with synthetic state
        run: python3 api/dev/tests/dev-persistence-recreate.py
