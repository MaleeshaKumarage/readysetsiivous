# Production stack for Mac mini (/opt/cleaning-suite). All host bindings loopback-only;
# Cloudflare Tunnel is the only public path.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: cleaning
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - cleaning_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleaning -d cleaning"]
      interval: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512m

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: start
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_HOSTNAME: auth.readysetsiivous.fi
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_JAVA_OPTS: "-Xms256m -Xmx768m -XX:MetaspaceSize=96m"
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1536m

  api:
    image: ghcr.io/maleeshakumarage/cleaning-suite-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cleaning;Username=cleaning;Password=${POSTGRES_PASSWORD}
      Marten__AutoCreateSchemaMode: CreateOrUpdate
      Auth__Keycloak__ServerUrl: https://auth.readysetsiivous.fi
      Auth__Keycloak__Audiences__0: cleaning-suite-web
      Auth__Keycloak__Audiences__1: cleaning-provisioner
      Auth__Keycloak__Audiences__2: account
      Auth__Keycloak__ProvisionerRealm: master
      Auth__Keycloak__ProvisionerClientId: cleaning-provisioner
      Auth__Keycloak__ProvisionerClientSecret: ${PROVISIONER_CLIENT_SECRET:-}
      Auth__Keycloak__AdminUser: ${KEYCLOAK_ADMIN_USER}
      Auth__Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: https://readysetsiivous.fi
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  cleaning_pgdata: {}
