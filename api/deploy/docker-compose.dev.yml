# Dev preview stack for the coding agent, on the agent VM (isolated from prod).
# Own DB + API + Keycloak on separate ports; no prod dependency.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: cleaning
      DB_SETUP_KEYCLOAK: "false"
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set separate dev migration password}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?set separate dev runtime password}
      DEV_KC_DB_PASSWORD: ${DEV_KC_DB_PASSWORD:?set a separate dev Keycloak database password}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./database/02-application.sh:/docker-entrypoint-initdb.d/02-application.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cleaning -d cleaning"]
      interval: 5s
      retries: 15

  keycloak-db-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["bash", "/init/01-keycloak.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: devpassword
      POSTGRES_USER: cleaning
      POSTGRES_DB: cleaning
      DEV_KC_DB_PASSWORD: ${DEV_KC_DB_PASSWORD:?set a separate dev Keycloak database password}
    volumes:
      - ../dev/init/01-keycloak.sh:/init/01-keycloak.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    profiles: [migration]
    image: cleaning-dev-api:${DEV_IMAGE_TAG:?set reviewed dev image tag}
    command: ["--migrate-schema"]
    restart: "no"
    environment:
      ConnectionStrings__MigrationConnection: Host=postgres;Port=5432;Database=cleaning;Username=cleaning_migrator;Password=${DB_MIGRATOR_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_URL: ${DEV_PUBLIC_AUTH_URL:-http://localhost:8081}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_dev
      KC_DB_USERNAME: keycloak_dev
      KC_DB_PASSWORD: ${DEV_KC_DB_PASSWORD:?set a separate dev Keycloak database password}
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json

  api:
    # Required protected host file; only this service receives per-tenant credentials.
    env_file:
      - ${API_IDENTITY_ENV_FILE:?Set API_IDENTITY_ENV_FILE to the reviewed protected tenant identity environment file}
    image: cleaning-dev-api:${DEV_IMAGE_TAG:?set reviewed dev image tag}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Empty trust lists disable forwarded processing; configure only verified upstream peers.
      ReverseProxy__KnownProxiesCsv: ${API_TRUSTED_PROXY_IPS:-}
      ReverseProxy__KnownNetworksCsv: ${API_TRUSTED_PROXY_NETWORKS:-}
      ReverseProxy__ForwardLimit: ${API_PROXY_FORWARD_LIMIT:-1}
      PublicRateLimit__Capacity: ${API_PUBLIC_RATE_LIMIT_CAPACITY:-10000}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cleaning;Username=cleaning_runtime;Password=${DB_RUNTIME_PASSWORD:?}
      Marten__AutoCreateSchemaMode: None
      Auth__Keycloak__ServerUrl: ${DEV_PUBLIC_AUTH_URL:-http://localhost:8081}
      Auth__Keycloak__AdminServerUrl: http://keycloak:8080
      Auth__Keycloak__Audience: cleaning-suite-api
      Auth__Keycloak__PlatformAudience: cleaning-suite-platform-api
      Auth__Keycloak__ProvisionerRealm: master
      Auth__Keycloak__ProvisionerClientId: cleaning-provisioner
      Auth__Keycloak__ProvisionerClientSecret: ${PROVISIONER_CLIENT_SECRET:-}
      # Mount explicit per-tenant credentials via a protected configuration file.
      # No bootstrap admin password is provided to the API container.
      Auth__Keycloak__ProvisioningSetupReviewed: "false"
      Entertainment__Gemini__ApiKey: ${GAME_GEMINI_API_KEY:-}
      Entertainment__Gemini__Keys__1: ${GEMINI_KEY_1:-}
      Entertainment__Gemini__Keys__2: ${GEMINI_KEY_2:-}
      Entertainment__Gemini__Keys__3: ${GEMINI_KEY_3:-}
      Entertainment__Gemini__Keys__4: ${GEMINI_KEY_4:-}
      Entertainment__Gemini__Keys__5: ${GEMINI_KEY_5:-}
      Entertainment__Gemini__Keys__6: ${GEMINI_KEY_6:-}
      Entertainment__Gemini__Keys__7: ${GEMINI_KEY_7:-}
      Entertainment__Gemini__Keys__8: ${GEMINI_KEY_8:-}
      Entertainment__Gemini__Keys__9: ${GEMINI_KEY_9:-}
      Entertainment__Gemini__Keys__10: ${GEMINI_KEY_10:-}
      Cors__AllowedOrigins__0: ${DEV_FRONTEND_URL:-http://localhost:3000}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      EmployeeInvites__LifespanSeconds: 86400
      EmployeeInvites__Smtp__Host: ${INVITE_SMTP_HOST:-}
      EmployeeInvites__Smtp__Port: ${INVITE_SMTP_PORT:-587}
      EmployeeInvites__Smtp__From: ${INVITE_SMTP_FROM:-}
      EmployeeInvites__Smtp__Auth: ${INVITE_SMTP_AUTH:-true}
      EmployeeInvites__Smtp__User: ${INVITE_SMTP_USER:-}
      EmployeeInvites__Smtp__Password: ${INVITE_SMTP_PASSWORD:-}
      EmployeeInvites__Smtp__UseResendApiKey: ${INVITE_SMTP_USE_RESEND_API_KEY:-false}
      EmployeeInvites__Smtp__StartTls: ${INVITE_SMTP_STARTTLS:-true}
      EmployeeInvites__Smtp__Ssl: ${INVITE_SMTP_SSL:-false}
      App__FrontendBaseUrl: ${DEV_FRONTEND_URL:-http://localhost:3000}
      Uploads__Path: /app/uploads
      Entertainment__KeyFilePath: /app/keys/entertainment.key
    volumes:
      - dev_uploads:/app/uploads
      - dev_keys:/app/keys
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      postgres:
        condition: service_started

volumes:
  dev_pgdata: {}
  dev_uploads: {}
  dev_keys: {}
