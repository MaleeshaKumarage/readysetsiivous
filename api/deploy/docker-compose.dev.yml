# Dev preview stack for the coding agent, on the agent VM (isolated from prod).
# Own DB + API + Keycloak on separate ports; no prod dependency.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: cleaning
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_URL: http://130.61.208.211:8081
    ports:
      - "8081:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json

  api:
    image: cleaning-dev-api:dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cleaning;Username=cleaning;Password=devpassword
      Marten__AutoCreateSchemaMode: CreateOrUpdate
      Auth__Keycloak__ServerUrl: http://130.61.208.211:8081
      Auth__Keycloak__AdminServerUrl: http://keycloak:8080
      Auth__Keycloak__Audiences__0: cleaning-suite-web
      Auth__Keycloak__Audiences__1: cleaning-provisioner
      Auth__Keycloak__Audiences__2: account
      Auth__Keycloak__ProvisionerRealm: master
      Auth__Keycloak__ProvisionerClientId: cleaning-provisioner
      Auth__Keycloak__ProvisionerClientSecret: ${PROVISIONER_CLIENT_SECRET:-}
      Auth__Keycloak__AdminUser: ${KEYCLOAK_ADMIN_USER}
      Auth__Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: "*"
      Resend__ApiKey: ${RESEND_API_KEY:-}
      EmployeeInvites__LifespanSeconds: 86400
      EmployeeInvites__Smtp__Host: ${INVITE_SMTP_HOST:-}
      EmployeeInvites__Smtp__Port: ${INVITE_SMTP_PORT:-587}
      EmployeeInvites__Smtp__From: ${INVITE_SMTP_FROM:-}
      EmployeeInvites__Smtp__Auth: ${INVITE_SMTP_AUTH:-true}
      EmployeeInvites__Smtp__User: ${INVITE_SMTP_USER:-}
      EmployeeInvites__Smtp__Password: ${INVITE_SMTP_PASSWORD:-}
      EmployeeInvites__Smtp__UseResendApiKey: ${INVITE_SMTP_USE_RESEND_API_KEY:-false}
      EmployeeInvites__Smtp__StartTls: ${INVITE_SMTP_STARTTLS:-true}
      EmployeeInvites__Smtp__Ssl: ${INVITE_SMTP_SSL:-false}
      App__FrontendBaseUrl: http://130.61.208.211
      Uploads__Path: /app/uploads
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_started

volumes:
  dev_pgdata: {}
