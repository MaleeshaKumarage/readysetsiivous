# Dev-only: postgres + keycloak. API runs via `dotnet run`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: cleaning_dev
      POSTGRES_DB: cleaning
      DEV_KC_DB_PASSWORD: ${DEV_KC_DB_PASSWORD:?set a separate dev Keycloak database password}
    ports:
      - "5434:5432"
    volumes:
      - cleaning_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cleaning -d cleaning"]
      interval: 5s
      retries: 15

  keycloak-db-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["bash", "/init/01-keycloak.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: cleaning_dev
      POSTGRES_USER: cleaning
      POSTGRES_DB: cleaning
      DEV_KC_DB_PASSWORD: ${DEV_KC_DB_PASSWORD:?set a separate dev Keycloak database password}
    volumes:
      - ./init/01-keycloak.sh:/init/01-keycloak.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?set in dev/.env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in dev/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_dev
      KC_DB_USERNAME: keycloak_dev
      KC_DB_PASSWORD: ${DEV_KC_DB_PASSWORD:?set a separate dev Keycloak database password}
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      retries: 30

volumes:
  cleaning_dev_pgdata: {}
